[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nlcspp-generator"
version = "0.1.0"
description = "Generate deterministic NLCS++ XSD files from information-model workbooks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1,<4",
    "xlrd>=2.0,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
nlcspp-generate = "nlcspp_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"